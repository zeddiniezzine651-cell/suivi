<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة المشاريع - بلدية باجة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .container-fluid { padding: 20px; }
        .no-print { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-label { font-weight: bold; color: #0056b3; font-size: 13px; }
        textarea.form-control { min-height: 40px; border: 2px solid #ced4da; }
        
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { border: 1.5px solid #000 !important; padding: 8px; text-align: center; vertical-align: middle; }
        th { background-color: #f2f2f2 !important; font-size: 12px; }
        
        /* تصغير حجم النسبة المئوية */
        .perc-text { font-size: 11px; font-weight: bold; }
        
        .notes-row { background-color: #fcfcfc !important; text-align: right !important; padding: 15px !important; }
        .admin-box { background-color: #e9ecef; font-weight: bold; padding: 5px; border-radius: 4px; display: block; margin-top: 5px; font-size: 11px; }

        @media print {
            @page { size: A4 landscape; margin: 1cm; }
            .no-print { display: none !important; }
            /* جعل كل مشروع يبدأ في صفحة جديدة */
            .project-block { page-break-after: always; display: block; margin-bottom: 0; }
            td { font-size: 12px; }
            .perc-text { font-size: 10px; }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="no-print d-flex justify-content-between align-items-center mb-3 p-3">
        <h4 class="text-primary fw-bold m-0">📄 متابعة المشاريع (نسخة الورقة الكاملة)</h4>
        <div class="d-flex w-25"><input type="text" id="searchInput" onkeyup="filterTable()" class="form-control" placeholder="🔍 ابحث هنا..."></div>
        <button onclick="window.print()" class="btn btn-dark">🖨️ طباعة (مشروع في كل صفحة)</button>
    </div>

    <div id="inputSection" class="no-print border p-3 rounded shadow-sm">
        <input type="hidden" id="editId"> 
        <div class="row g-2">
            <div class="col-md-3"><label class="form-label">المشروع</label><textarea id="n" class="form-control"></textarea></div>
            <div class="col-md-2"><label class="form-label">المقاول/المكتب</label><textarea id="c" class="form-control"></textarea></div>
            <div class="col-md-1"><label class="form-label">كلفة</label><input type="number" id="tot" class="form-control"></div>
            <div class="col-md-1"><label class="form-label">مدفوع</label><input type="number" id="paid" class="form-control"></div>
            
            <div class="col-md-2"><label class="form-label text-success">📅 إذن بداية الأشغال</label><input type="text" id="d_start" class="form-control" placeholder="مثلاً: 12-04-2026"></div>
            <div class="col-md-2"><label class="form-label text-danger">📅 إذن توقف الأشغال</label><input type="text" id="d_stop" class="form-control" placeholder="التوقف إن وجد"></div>
            
            <div class="col-md-2"><label class="form-label">بصدد</label><textarea id="z_o" class="form-control"></textarea></div>
            <div class="col-md-2"><label class="form-label">لم تبدأ</label><textarea id="z_p" class="form-control"></textarea></div>
            <div class="col-md-1"><label class="form-label">انتهت</label><textarea id="z_d" class="form-control"></textarea></div>
            <div class="col-md-1"><label class="form-label">مادي%</label><input type="number" id="prog_m" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">رابط الـ Scan</label><input type="url" id="scanUrl" class="form-control"></div>
            <div class="col-md-2 d-flex align-items-end"><button onclick="saveData()" id="saveBtn" class="btn btn-primary w-100 fw-bold">💾 حفظ</button></div>
        </div>
    </div>

    <div id="printArea">
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const config = { databaseURL: "https://suivi-projets-4817b-default-rtdb.firebaseio.com/" };
    const app = initializeApp(config);
    const db = getDatabase(app);
    const r = ref(db, 'projects_vFinal');

    onValue(r, (s) => {
        const area = document.getElementById('printArea');
        area.innerHTML = '';
        const data = s.val();
        if (data) {
            Object.keys(data).forEach(k => {
                const p = data[k];
                const total = parseFloat(p.tot) || 0;
                const paid = parseFloat(p.paid) || 0;
                const fin_p = total > 0 ? ((paid / total) * 100).toFixed(1) : 0;

                area.insertAdjacentHTML('beforeend', `
                    <div class="project-block">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th width="15%">المشروع</th>
                                    <th>المقاول</th>
                                    <th>كلفة</th>
                                    <th>مدفوع</th>
                                    <th>باقي</th>
                                    <th>مالي%</th>
                                    <th>مادي%</th>
                                    <th>بصدد</th>
                                    <th>لم تبدأ</th>
                                    <th>انتهت</th>
                                    <th class="no-print">Scan</th>
                                    <th class="no-print">إجراء</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="fw-bold">${p.name}</td>
                                    <td>${p.c}</td>
                                    <td>${total.toLocaleString()}</td>
                                    <td>${paid.toLocaleString()}</td>
                                    <td class="text-danger">${(total - paid).toLocaleString()}</td>
                                    <td class="perc-text text-success">${fin_p}%</td>
                                    <td class="perc-text text-primary">${p.prog_m}%</td>
                                    <td>${p.z_o}</td><td>${p.z_p}</td><td>${p.z_d}</td>
                                    <td class="no-print">${p.scanUrl ? `<a href="${p.scanUrl}" target="_blank">📄</a>` : '-'}</td>
                                    <td class="no-print">
                                        <button onclick="editProject('${k}', ${JSON.stringify(p).replace(/"/g, '&quot;')})" class="btn btn-sm btn-outline-warning">✏️</button>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="4" class="notes-row">
                                        <div class="admin-box">📅 إذن بداية الأشغال: ${p.d_start || '---'}</div>
                                        <div class="admin-box text-danger">📅 إذن توقف الأشغال: ${p.d_stop || '---'}</div>
                                    </td>
                                    <td colspan="8" class="notes-row" style="vertical-align:top">
                                        <strong>ملاحظات فنية:</strong><br>${p.note || '...'}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `);
            });
        }
    });

    window.saveData = function() {
        const id = document.getElementById('editId').value;
        const pData = {
            name: document.getElementById('n').value, c: document.getElementById('c').value,
            tot: parseFloat(document.getElementById('tot').value) || 0,
            paid: parseFloat(document.getElementById('paid').value) || 0,
            d_start: document.getElementById('d_start').value,
            d_stop: document.getElementById('d_stop').value,
            prog_m: document.getElementById('prog_m').value,
            z_o: document.getElementById('z_o').value, z_p: document.getElementById('z_p').value, z_d: document.getElementById('z_d').value,
            scanUrl: document.getElementById('scanUrl').value,
            note: "نص افتراضي للملاحظة" // يمكنك إضافة خانة للملاحظات في الـ HTML إذا أردت
        };
        id ? update(ref(db, 'projects_vFinal/'+id), pData).then(resetForm) : push(r, pData).then(resetForm);
    };

    window.editProject = function(id, data) {
        document.getElementById('editId').value = id;
        document.getElementById('n').value = data.name;
        document.getElementById('d_start').value = data.d_start || '';
        document.getElementById('d_stop').value = data.d_stop || '';
        document.getElementById('saveBtn').innerText = "تحديث 🔄";
    };

    window.resetForm = () => { location.reload(); };
</script>
</body>
</html>
